<script>
function applyTheme(t) {
  document.documentElement.classList.toggle("dark", t === "dark");
  /* age/TB report tables carry their own dark CSS keyed on data-theme */
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
}
applyTheme(localStorage.getItem("cf_theme") === "dark" ? "dark" : "light");
function cfTheme(t) { applyTheme(t); localStorage.setItem("cf_theme", t); }
var cfM = localStorage.getItem("cf_mobile");
if (cfM === "1" || (cfM === null && screen.width < 700))
  document.documentElement.classList.add("mobile");
function cfMobile() {
  var on = document.documentElement.classList.toggle("mobile");
  localStorage.setItem("cf_mobile", on ? "1" : "0");
}
</script>



<style>
body { font-family: "Segoe UI", sans-serif; margin: 0; background: #f0f2f5; }
.wrap { max-width: 1700px; margin: 0 auto; padding: 0 16px 40px; }
nav { background: #1a4f80; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px;
      position: sticky; top: 0; z-index: 10; align-items: center; }
nav a { color: #cfe0f0; text-decoration: none; font-size: 13px; padding: 5px 11px; border-radius: 4px; }
nav a:hover { background: #2a6099; color: #fff; }
nav a.cur { background: #fff; color: #1a4f80; font-weight: 600; }
.pg-title { font-size: 20px; font-weight: 700; color: #1a3c6e; margin: 18px 0 2px; }
.pg-sub { font-size: 12px; color: #666; margin-bottom: 14px; }
.dl-btn { display: inline-block; background: #1a4f80; color: #fff; padding: 7px 14px;
          border-radius: 5px; text-decoration: none; font-size: 13px; }
.title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px 0 2px; }
.title-row .pg-title { margin: 0; }
.title-btns { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .cell { min-width: 0; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
h3 { color: #1a3c6e; border-bottom: 2px solid #1a3c6e; padding-bottom: 4px; margin: 26px 0 10px; }
.charts-anchor { margin-top: 30px; }

/* Account column width comes from the build-time colgroup */
.rt th.acc { min-width: 0 !important; }

/* Each table scrolls in its own box: header rows stay frozen inside it,
   unfrozen once the page scrolls past to the charts */
.rw { max-height: 82vh; overflow: auto; }
.rt tr.yr-h th { height: 24px; box-sizing: border-box; }
.rt thead tr:not(.yr-h) th { top: 24px; }

/* Theme + view toggles */
.nav-right { margin-left: auto; display: flex; gap: 4px; }
.nav-right button { background: #2a6099; color: #fff; border: none; border-radius: 4px;
                    padding: 4px 9px; font-size: 12px; cursor: pointer; }
.nav-right button:hover { background: #3b74b3; }

/* Mobile view: narrow account col via colgroup, wrap names */
html.mobile .rt col.acc-col { width: 132px !important; }
html.mobile .rt th.acc, html.mobile .rt td.acc {
  white-space: normal; word-break: break-word;
  width: 132px; max-width: 132px; min-width: 132px !important;
  box-sizing: border-box;
}
html.mobile .rt tbody tr:nth-child(odd) td.acc { background: #fff; }
html.mobile .rt tbody tr:nth-child(even) td.acc { background: #f6f6f6; }
html.mobile .rt { font-size: 10.5px; }
html.mobile .rt td, html.mobile .rt th { padding: 3px 4px; }

/* Dark mode: dark chrome, report tables stay readable (age/TB tables have their
   own data-theme dark styling; CF tables stay white cards) */
html.dark body { background: #0f1420; }
html.dark .pg-title { color: #d7e3f4; }
html.dark .pg-sub { color: #9aa7b8; }
html.dark h3 { color: #d7e3f4; border-bottom-color: #d7e3f4; }
html.dark .sec-title { color: #d7e3f4 !important; border-bottom-color: #d7e3f4 !important; }
html.dark .rpt-name, html.dark .rpt-sub { color: #d7e3f4 !important; }

/* Landing cards */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
@media (max-width: 800px) { .cards { grid-template-columns: 1fr; } }
.card { display: block; background: #1a4f80; color: #fff; border-radius: 10px;
        padding: 34px 26px; text-decoration: none; transition: background .15s; }
.card:hover { background: #2a6099; }
.card .c-icon { font-size: 34px; }
.card .c-name { font-size: 20px; font-weight: 700; margin: 10px 0 6px; }
.card .c-desc { font-size: 13px; color: #cfe0f0; }

/* Company sub-tabs + panes (Age dashboard) */
.ctabs { display: flex; flex-wrap: wrap; gap: 5px; margin: 14px 0; }
.ctabs button, .mtabs button { background: #d7dfe9; color: #1a3c6e; border: none;

.ctabs button.on, .mtabs button.on { background: #1a4f80; color: #fff; }
.mtabs { display: flex; gap: 5px; margin: 10px 0; }
html.dark .ctabs button, html.dark .mtabs button { background: #253550; color: #b8c8dc; }
html.dark .ctabs button.on, html.dark .mtabs button.on { background: #4a7ab0; color: #fff; }
.status-line { background: #e5f2e5; color: #1c5c1c; border-radius: 5px; padding: 8px 12px;
               font-size: 13px; margin: 8px 0; }
html.dark .status-line { background: #16321a; color: #8fce8f; }
</style>

<script>
document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-show]");
  if (!b) return;
  var grp = b.getAttribute("data-grp");
  document.querySelectorAll('[data-pane="' + grp + '"]').forEach(function (p) {
    p.style.display = "none";
  });
  var pane = document.getElementById(grp + "-" + b.getAttribute("data-show"));
  if (pane) pane.style.display = "block";
  b.parentElement.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
  b.classList.add("on");
});
function cfInitBody() {
  /* activate first tab of every group */
  document.querySelectorAll(".ctabs, .mtabs").forEach(function (g) {
    var b = g.querySelector("button[data-show]");
    if (b) b.click();
  });
  /* keep report tables horizontally in sync */
  var rws = document.querySelectorAll(".rw");
  var lock = false;
  rws.forEach(function (rw) {
    rw.addEventListener("scroll", function () {
      if (lock) return;
      lock = true;
      rws.forEach(function (o) { if (o !== rw) o.scrollLeft = rw.scrollLeft; });
      lock = false;
    }, { passive: true });
  });
}
cfInitBody();
</script>


<script>
(function () {
  function load() {
    var el = document.getElementById("frag");
    fetch("https://vxyonlatyhvbczccajrj.supabase.co/storage/v1/object/public/ramcom-cf/frag/fc/rgs.html?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (html) {
        el.innerHTML = html;
        el.querySelectorAll("script").forEach(function (old) {
          var s = document.createElement("script");
          if (old.src) s.src = old.src; else s.textContent = old.textContent;
          old.replaceWith(s);
        });
        cfInitBody();
      })
      .catch(function (err) {
        el.innerHTML = "<p style='padding:30px 0'>Failed to load data (" + err.message +
                       "). <a href='javascript:location.reload()'>Retry</a></p>";
      });
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", load);
  else load();
})();
</script>
